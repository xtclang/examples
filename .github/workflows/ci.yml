name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: "Publish Docker image to GHCR using branch and SHA tags"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 (bootstrap — daemon auto-provisions JDK 25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # The XTC xunit engine currently uses a shared /tmp/xunit scratch directory.
      # Keep test execution serialized until xtclang/xvm isolates that directory per invocation.
      - name: Build (compile + run all tests)
        run: ./gradlew build --stacktrace --max-workers=1

      - name: Assemble installDist
        run: ./gradlew installDist --stacktrace

      - name: Smoke-run welcomeTest
        run: ./gradlew :welcome:runXtc --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  docker:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    name: Build and publish Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.publish_docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker-tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          safe_ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"

          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            if [ "${GITHUB_REF_NAME}" = "master" ]; then
              echo "${image}:latest"
              echo "${image}:master"
            else
              echo "${image}:${safe_ref}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' || inputs.publish_docker }}
          load: false
          tags: ${{ steps.docker-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
