# CI placeholder.
#
# Purpose: register the workflow on the default branch so that
#   1. `workflow_dispatch` becomes available in the Actions UI / via
#      `gh workflow run CI`, allowing branches to be tested manually
#      before they are merged;
#   2. the workflow name "CI" is reserved, so when a feature branch
#      replaces this file with a real implementation the run history
#      stays under the same name.
#
# The real CI is being staged on a feature branch and will replace this
# file when merged. Until then this job exists only to succeed.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  noop:
    name: No CI yet
    runs-on: ubuntu-latest
    steps:
      - run: echo "No CI yet."
