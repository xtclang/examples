# Version of all projects in this composite build
version=0.1.0

# Java Toolchain Configuration
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

# Daemon JVM toolchain repositories. The xtc-plugin requires JVM 25 at the
# daemon level, and gradle/gradle-daemon-jvm.properties declares that. The
# Foojay plugin in settings.gradle.kts only registers itself for *task*
# toolchain provisioning; the daemon's parallel provisioner needs this
# explicit opt-in to use Foojay too.
org.gradle.daemon.jvm.toolchain.repositories=foojay

# Gradle performance optimizations
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# JVM arguments for Java 24+ native access
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED

# Node.js download (set to false to use system Node.js)
node.download=true
