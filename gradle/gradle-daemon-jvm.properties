# Gradle Daemon JVM criteria (Gradle 8.8+).
#
# The xtc-plugin is published with Gradle variant attribute
# `org.gradle.jvm.version=25`, which means the Gradle daemon loading it
# must run on JVM 25+. The Foojay resolver (configured in
# settings.gradle.kts) provisions task toolchains, but does NOT apply to
# the daemon itself — the daemon runs on whatever JVM boots the Gradle
# wrapper. This file fixes that: Gradle reads these criteria at startup
# and auto-provisions (via Foojay) a JDK 25 for the daemon, so a
# bootstrap JDK of Gradle's minimum (17+) is sufficient.
toolchainVersion=25
